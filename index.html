<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>西窗 · 灯下读诗</title>
  <meta name="description" content="西窗——唐诗宋词，一首一屏，灯下读诗，与古人夜话。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;900&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <!-- 主题切换：月（夜窗）/ 烛（宣纸） -->
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换昼夜">
    <span class="ico-moon" aria-hidden="true">☾</span>
    <span class="ico-sun" aria-hidden="true">☼</span>
  </button>

  <!-- 右侧页点导航 -->
  <nav id="dots" class="dots" aria-label="翻页"></nav>

  <!-- 全屏诗卡 deck（封面 / 每首一屏 / 落款 由脚本注入） -->
  <main id="deck" class="deck" tabindex="0" aria-label="诗词"></main>

  <script src="assets/poems.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
